server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 16m;
    fastcgi_read_timeout 120s;

    location / {
        fastcgi_pass p2s-fpm-8511:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }
}
