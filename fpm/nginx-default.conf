server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # Realistic upload endpoint: body limit raised, but header buffers and
    # fastcgi_request_buffering left at nginx defaults (the leak-relevant knobs).
    client_max_body_size 16m;

    location / {
        fastcgi_pass p2s-fpm-http:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }
}
